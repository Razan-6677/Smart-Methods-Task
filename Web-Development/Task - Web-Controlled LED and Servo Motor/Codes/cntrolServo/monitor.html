<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Monitor</title>
<style>
  :root {
    --bg: #F7F8F6;
    --card: #FFFFFF;
    --ink: #1C1F26;
    --muted: #7A8087;
    --line: #E3E6E2;
    --accent: #0F6E5C;
    --accent-soft: #E6F2EF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    padding: 24px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 40px;
    box-shadow: 0 1px 2px rgba(28,31,38,0.04), 0 8px 24px rgba(28,31,38,0.06);
    width: 100%;
    max-width: 320px;
    text-align: center;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .letter {
    font-family: 'Consolas', 'SF Mono', monospace;
    font-size: 84px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin: 8px 0 12px;
  }

  .meaning {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 18px;
  }

  .updated {
    font-family: 'Consolas', 'SF Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    border-top: 1px dashed var(--line);
    padding-top: 14px;
  }

  a {
    display: inline-block;
    margin-top: 20px;
    font-size: 11.5px;
    color: var(--accent);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <div class="panel">
    <div class="eyebrow"><span class="dot"></span>ROBOT MONITOR</div>
    <div class="letter" id="letter">–</div>
    <div class="meaning" id="meaning">Waiting for data...</div>
    <div class="updated" id="updated"></div>
    <a href="index.html">← Back to control pad</a>
  </div>

  <script>
    const names = { f: 'forward', b: 'backward', l: 'left', r: 'right', S: 'stop' };

    function refresh() {
      fetch('get_state.php')
        .then(res => res.json())
        .then(data => {
          if (data.command) {
            document.getElementById('letter').innerText = data.command;
            document.getElementById('meaning').innerText = names[data.command] || 'unknown';
            document.getElementById('updated').innerText = 'Last updated: ' + (data.updated_at || '–');
          }
        })
        .catch(() => {
          document.getElementById('meaning').innerText = 'Could not reach server';
        });
    }

    refresh();
    setInterval(refresh, 2000); 
  </script>

</body>
</html>
